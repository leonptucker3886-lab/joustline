<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JoustLine - The Lists (BETA)</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#120c07;color:#f6ead0;font-family:"Palatino Linotype",Georgia,serif;overflow:hidden}
#wrap{position:relative;max-width:520px;height:100%;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#beta{position:absolute;top:0;left:0;right:0;z-index:5;background:rgba(179,38,38,.8);font:600 11px system-ui,sans-serif;letter-spacing:.08em;text-align:center;padding:3px;color:#fff}
#hud{position:absolute;top:24px;left:12px;right:12px;z-index:4;display:flex;gap:10px}
.card{flex:1;padding:8px 10px;border-radius:14px;background:rgba(20,12,6,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,220,150,.25);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.nm{font-variant:small-caps;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font:500 10px system-ui,sans-serif;opacity:.75;letter-spacing:.05em;text-transform:uppercase}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.45);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .5s cubic-bezier(.2,.9,.3,1.2);background:linear-gradient(90deg,#f7d774,#e08a2c)}
#fbar i{background:linear-gradient(90deg,#ff7a6b,#b8202b)}
#score{position:absolute;top:88px;left:0;right:0;text-align:center;z-index:4;font:600 11px system-ui,sans-serif;letter-spacing:.12em;opacity:.85;text-shadow:0 1px 4px #000}
#cap{position:absolute;left:16px;right:16px;bottom:210px;z-index:4;text-align:center;opacity:0;transform:translateY(10px);transition:all .35s}
#cap.on{opacity:1;transform:none}#cap .sc{font-variant:small-caps;font-weight:700;letter-spacing:.12em;font-size:13px;color:#f7d774;text-shadow:0 2px 6px #000}
#cap .q{font-style:italic;font-size:19px;text-shadow:0 2px 8px #000,0 0 2px #000}
#banner{position:absolute;top:36%;left:0;right:0;text-align:center;z-index:4;font-weight:800;font-size:36px;letter-spacing:.05em;color:#fff3c4;text-shadow:0 4px 0 #7a3b0a,0 8px 24px rgba(0,0,0,.6);opacity:0;transform:scale(.6);transition:all .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
#banner.on{opacity:1;transform:scale(1)}
#ui{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:14px 12px 18px;background:linear-gradient(180deg,transparent,rgba(12,7,3,.85) 30%)}
.lbl{font:600 10px system-ui,sans-serif;letter-spacing:.14em;opacity:.7;margin:6px 4px 4px;text-transform:uppercase}
.row{display:flex;gap:8px}
.row button{flex:1;padding:11px 4px;font-family:inherit;font-weight:600;font-size:15px;color:#f6ead0;background:rgba(255,255,255,.08);border:1px solid rgba(255,220,150,.28);border-radius:12px;transition:all .15s}
.row button.sel{background:linear-gradient(180deg,#f7d774,#d79a3a);color:#2a1606;border-color:#ffe9a8;box-shadow:0 0 16px rgba(247,215,116,.45)}
#go{width:100%;margin-top:12px;padding:15px;font-family:inherit;font-weight:800;font-size:20px;letter-spacing:.18em;color:#2a1606;border:0;border-radius:16px;background:linear-gradient(180deg,#ffe28a,#e39a2d);box-shadow:0 8px 24px rgba(227,154,45,.45),inset 0 -3px 0 rgba(0,0,0,.2)}
#go:active{transform:scale(.97)}
</style></head><body><div id="wrap">
<canvas id="c"></canvas>
<div id="beta">BETA · testing build</div>
<div id="hud"><div class="card"><div class="nm">Jack <span class="sub">as "Lord Bart"</span></div><div class="bar" id="jbar"><i style="width:100%"></i></div></div>
<div class="card"><div class="nm" id="fn">-</div><div class="sub" id="fs"></div><div class="bar" id="fbar"><i style="width:100%"></i></div></div></div>
<div id="score"></div><div id="banner"></div><div id="cap"><div class="sc"></div><div class="q"></div></div>
<div id="ui"><div class="lbl">Aim</div><div class="row" id="aims"><button data-v="helm">Helm</button><button data-v="shield" class="sel">Shield</button><button data-v="chest">Chest</button></div>
<div class="lbl">Pace</div><div class="row" id="spd"><button data-v="0.8">Trot</button><button data-v="1" class="sel">Canter</button><button data-v="1.3">Gallop</button></div>
<button id="go">RIDE</button></div></div>
<script>
const FOES=[{n:"Jean de Saintré",st:"steady",g:"shield",sk:.5,hp:3,c:"#2f6fd0",l:"A gentleman's pass, squire."},
{n:"Jacques de Lalaing",st:"precise",g:"helm",sk:.7,hp:3,c:"#e0b020",l:"Lalaing is never unhorsed!"},
{n:"Suero de Quiñones",st:"wild",g:"chest",sk:.55,hp:4,c:"#c0262a",l:"For love! And this iron collar!"},
{n:"Boucicaut",st:"brute",g:"shield",sk:.65,hp:5,c:"#303030",l:"Boucicaut does not tire."},
{n:"Charles de Wierd",st:"weird",g:"none",sk:.3,hp:2,c:"#8a3dc0",l:"(Nobody noticed he was riding.)"}];
const $=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');let W,H;
function rs(){const d=Math.min(2,devicePixelRatio||1);W=c.clientWidth;H=c.clientHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);}addEventListener('resize',rs);rs();
const img=s=>{const i=new Image();i.src=s;return i},BG=img('assets/bg.webp'),FOE=img('assets/foe.webp'),JACK=img('assets/jack.webp'),tint={};
function tinted(f){if(tint[f.n])return tint[f.n];if(!FOE.naturalWidth)return null;const o=document.createElement('canvas');o.width=FOE.naturalWidth;o.height=FOE.naturalHeight;const g=o.getContext('2d');g.drawImage(FOE,0,0);g.globalCompositeOperation='color';g.globalAlpha=.6;g.fillStyle=f.c;g.fillRect(0,0,o.width,o.height);g.globalAlpha=1;g.globalCompositeOperation='destination-in';g.drawImage(FOE,0,0);return tint[f.n]=o;}
let S={f:0,j:4,fh:3,aim:"shield",sp:1,ph:"ready",t:0,sh:0,fl:0,slow:0,zm:0,parts:[],dust:[],res:"",hit:0,pass:1,w:0,lo:0};
const F=()=>FOES[S.f];
function say(a,b){const e=$('cap');e.classList.remove('on');setTimeout(()=>{e.querySelector('.sc').textContent=a;e.querySelector('.q').textContent='"'+b+'"';e.classList.add('on')},120);}
function ban(t){const b=$('banner');b.textContent=t;b.classList.add('on');setTimeout(()=>b.classList.remove('on'),1300);}
function bar(){const f=F();$('jbar').firstChild.style.width=Math.max(0,S.j/4*100)+'%';$('fbar').firstChild.style.width=Math.max(0,S.fh/f.hp*100)+'%';$('fn').textContent=f.n;$('fs').textContent=f.st+' · guards '+f.g;$('score').textContent='PASS '+S.pass+'  ·  WINS '+S.w+'  ·  FALLS '+S.lo;}
['aims','spd'].forEach(g=>document.querySelectorAll('#'+g+' button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#'+g+' button').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');if(g=='aims')S.aim=b.dataset.v;else S.sp=+b.dataset.v;}));
$('go').onclick=()=>{if(S.ph=="charge")return;if(S.res=="fd"){S.f=(S.f+1)%5;S.fh=F().hp;S.pass=1;say("HERALD","Next challenger: "+F().n+"!");}if(S.res=="jd"){S.j=4;S.fh=F().hp;S.pass=1;}S.res="";S.ph="charge";S.t=0;S.hit=0;bar();};
function resolve(){const f=F();let acc=.75-(S.sp-1)*.6+(Math.random()-.5)*.3,pw=S.sp,o=[];
if(S.aim=="helm"){acc-=.2;pw+=.8;}if(S.aim=="chest")pw+=.3;if(f.g==S.aim)acc-=.25;if(f.st=="weird")acc+=.3;
const fa=f.sk+(f.st=="wild"?(Math.random()-.5)*.6:0),jh=Math.random()<acc,fh=Math.random()<fa;let d=0,br=0;
if(jh){d=pw>1.9?3:pw>1.2?2:1;if(Math.random()<.3){o.push("LANCE SHATTERED! ");d++;br=1;}S.fh-=d;}
if(fh){S.j-=(f.st=="brute"||(f.st=="precise"&&Math.random()<.3))?2:1;}
if(S.fh<=0){S.res="fd";S.w++;ban("UNHORSED!");}else if(S.j<=0){S.res="jd";S.lo++;ban("JACK FALLS");}else{S.res=jh&&fh?"b":jh?"h":fh?"x":"m";if(br)ban("SHATTERED!");else if(jh)ban("HIT!");}
const L={b:["CROWD","Both lances strike!"],h:["CROWD","A clean hit for 'Lord Bart'!"],x:["JACK","(silent misery inside the helm)"],m:["HERALD","Both miss. Mildahouse yawns."],fd:[f.n.toUpperCase(),f.l],jd:["CROWD","Somebody please help Jack off the horse!"]}[S.res];
say(L[0],o.join("")+L[1]);
if(jh||fh){S.fl=1;S.sh=22;S.slow=45;S.zm=.08;navigator.vibrate&&navigator.vibrate(d>2?[60,40,140]:90);
for(let i=0;i<(br?60:30);i++){const a=Math.random()*6.28,v=3+Math.random()*(br?14:8);S.parts.push({x:W*.6,y:H*.48,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,r:Math.random()*6.28,vr:(Math.random()-.5)*.5,l:6+Math.random()*16,life:1,s:Math.random()<.35});}}
S.pass++;bar();}
let last=performance.now();
function draw(now){const dt=Math.min(2,(now-last)/16.7);last=now;
const rate=S.slow>0?.12:1;if(S.slow>0)S.slow-=dt;
if(S.ph=="charge"){S.t+=.0075*S.sp*dt*rate;if(S.t>=.5&&!S.hit){S.hit=1;resolve();}if(S.t>=1)S.ph="done";}
S.zm*=Math.pow(.94,dt);S.sh*=Math.pow(.86,dt);S.fl*=Math.pow(.85,dt);
const p=S.ph=="ready"?0:S.t,run=S.ph=="charge"?1:0,tt=now/1000,f=F(),T=tinted(f),vy=H*.43;
x.save();const k=S.sh>.3?(Math.random()-.5)*S.sh:0,z=1+S.zm+run*.012*Math.sin(tt*18*S.sp);
x.translate(W/2+k,H/2+k*.5);x.scale(z,z);x.translate(-W/2,-H/2);
if(BG.naturalWidth){const s=Math.max(W/BG.naturalWidth,H/BG.naturalHeight)*(1.04+p*.08),bw=BG.naturalWidth*s,bh=BG.naturalHeight*s;x.drawImage(BG,(W-bw)/2,(H-bh)/2,bw,bh);}else{x.fillStyle="#c79a55";x.fillRect(0,0,W,H);}
let kk=p<=.5?1/((1-p*2)*7+1):1+(p-.5)*5;const fall=S.res=="fd"&&p>.5?Math.min(1,(p-.5)*4):0;
if(T){const fhh=H*.58*kk,fw=fhh*T.width/T.height,km=Math.min(kk,1),fx=W*.5+W*.2*km+(p>.5?(p-.5)*W*2:0),fb=vy+(H*.86-vy)*km-Math.abs(Math.sin(tt*14*S.sp))*6*km*run;
x.save();x.globalAlpha=p>.5?Math.max(0,1-(p-.5)*2.2):1;
x.fillStyle="rgba(40,20,5,.35)";x.beginPath();x.ellipse(fx,fb,fw*.4,fw*.08,0,0,7);x.fill();
x.translate(fx,fb-fhh/2);x.rotate(fall*1.2);x.translate(fall*fw*.6,-fall*fhh*.3);x.drawImage(T,-fw/2,-fhh/2,fw,fhh);x.restore();
if(run&&p<.55&&Math.random()<.6)S.dust.push({x:fx+(Math.random()-.5)*fw*.4,y:fb,r:3+8*km*Math.random(),a:.45,vx:(Math.random()-.5)*2,vy:-Math.random()*1.5});}
x.fillStyle="#e8c88a";S.dust=S.dust.filter(d=>{d.x+=d.vx*dt;d.y+=d.vy*dt;d.r+=.5*dt;d.a-=.012*dt;if(d.a<=0)return false;x.globalAlpha=d.a;x.beginPath();x.arc(d.x,d.y,d.r,0,7);x.fill();return true;});x.globalAlpha=1;
if(JACK.naturalWidth){const jf=S.res=="jd"&&p>.5?Math.min(1,(p-.5)*4):0,jh=H*.5,jw=jh*JACK.naturalWidth/JACK.naturalHeight,bob=run?Math.abs(Math.sin(tt*9*S.sp))*8:Math.sin(tt*2)*2,aimT=S.aim=="helm"?-.05:S.aim=="chest"?.05:0;
x.save();x.translate(W*.02+jw/2,H*1.02-jh/2+bob+jf*H*.15);x.rotate(aimT*(1-jf)-jf*.5);x.drawImage(JACK,-jw/2,-jh/2,jw,jh);x.restore();}
S.parts=S.parts.filter(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=.35*dt;q.r+=q.vr*dt;q.life-=.012*dt;if(q.life<=0)return false;x.save();x.globalAlpha=q.life;x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.s?"#fff6d0":"#b98a4e";q.s?x.fillRect(-2,-2,4,4):x.fillRect(-q.l/2,-2,q.l,4);x.restore();return true;});
x.restore();
const v=x.createRadialGradient(W/2,H*.45,H*.25,W/2,H*.5,H*.8);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(10,5,0,.55)");x.fillStyle=v;x.fillRect(0,0,W,H);
if(S.fl>.02){x.fillStyle="rgba(255,244,210,"+S.fl*.7+")";x.fillRect(0,0,W,H);}
requestAnimationFrame(draw);}
say("HERALD","Jack, riding as Lord Bart upon Mildahouse, versus "+F().n+"!");bar();requestAnimationFrame(draw);
</script></body></html>
