<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Joustline — Chapter 1: Morning After</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1b120b;color:#f3e6c8;font-family:Georgia,serif;overflow:hidden;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
#stage{position:relative;flex:1;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#e8c77a;pointer-events:none;text-shadow:0 1px 2px #000}
#box{background:linear-gradient(#f4e7c6,#e3cf9f);color:#2b1a0c;border-top:3px solid #8a5a24;padding:14px 16px calc(14px + env(safe-area-inset-bottom));min-height:34%;display:flex;flex-direction:column;gap:10px}
#who{font-weight:bold;font-size:14px;color:#7a2d14;text-transform:uppercase;letter-spacing:.08em}
#line{font-size:17px;line-height:1.4;flex:1}
#line i{color:#5b4127}
#opts{display:flex;flex-direction:column;gap:8px}
button{font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:2px solid #8a5a24;background:#fff7e3;color:#2b1a0c;text-align:left}
button:active{background:#f1d79c}
.tap{opacity:.7;font-size:13px;text-align:right}
#meter{position:absolute;left:10%;right:10%;bottom:18px;height:14px;border:2px solid #e8c77a;border-radius:8px;display:none}
#meter div{height:100%;width:0;background:linear-gradient(90deg,#c0392b,#e8c77a);border-radius:6px}
#toast{position:absolute;top:40px;left:0;right:0;text-align:center;font-size:15px;color:#ffe9a8;text-shadow:0 2px 3px #000;opacity:0;transition:opacity .3s;pointer-events:none;padding:0 20px}
#ach{position:absolute;top:12px;left:50%;transform:translate(-50%,-90px);background:#2b1a0c;border:2px solid #e8c77a;color:#e8c77a;padding:8px 14px;border-radius:12px;font-size:14px;transition:transform .4s;white-space:nowrap}
</style><script src="cutscene.js"></script><script src="opening.js"></script></head>
<body><div id="app">
<div id="stage"><canvas id="c"></canvas>
<div id="hud"><span>Chapter 1 · Morning After</span><span><button id="chapBtn" style="margin-right:8px;padding:4px 10px;font:inherit;border-radius:6px;border:1px solid #e8c77a;background:#2a1a10;color:#e8c77a">Chapters ☰</button><span id="xp">XP 0</span></span></div>
<div id="chapMenu" style="display:none;position:absolute;top:44px;right:8px;z-index:50;background:#1b120b;border:2px solid #e8c77a;border-radius:10px;padding:10px;min-width:220px"></div>
<div id="toast"></div><div id="meter"><div></div></div><div id="ach"></div></div>
<div id="box"><div id="who"></div><div id="line"></div><div id="opts"></div></div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const who=document.getElementById('who'),line=document.getElementById('line'),opts=document.getElementById('opts');
const meter=document.getElementById('meter'),bar=meter.firstElementChild,toast=document.getElementById('toast');
let W,H,xp=0,scene='tent',mini=null;
function fit(){const r=C.getBoundingClientRect(),d=devicePixelRatio||1;C.width=r.width*d;C.height=r.height*d;X.setTransform(d,0,0,d,0,0);W=r.width;H=r.height}
addEventListener('resize',fit);fit();
function addXP(n){xp+=n;document.getElementById('xp').textContent='XP '+xp}
function ach(name,n){const a=document.getElementById('ach');a.textContent='🏆 '+name+' +'+n+' XP';addXP(n);a.style.transform='translate(-50%,0)';setTimeout(()=>a.style.transform='translate(-50%,-90px)',2600)}
function say(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(say.k);say.k=setTimeout(()=>toast.style.opacity=0,1800)}
function meterOn(p){meter.style.display='block';bar.style.width=p+'%'}
function meterOff(){meter.style.display='none'}
let queue=[],done=null;
function talk(lines,then){queue=lines.slice();done=then;next()}
function next(){
  opts.innerHTML='';
  if(!queue.length){const d=done;done=null;d&&d();return}
  const l=queue.shift();who.textContent=l[0];line.innerHTML=l[1];
  if(l[2])l[2].forEach(([txt,fn])=>{const b=document.createElement('button');b.textContent=txt;b.onclick=e=>{e.stopPropagation();opts.innerHTML='';fn()};opts.appendChild(b)});
  else{const p=document.createElement('div');p.className='tap';p.textContent='tap ▸';opts.appendChild(p)}
}
document.getElementById('box').addEventListener('click',()=>{if(!opts.querySelector('button')&&!mini)next()});
function instr(title,txt){who.textContent=title;line.innerHTML=txt;opts.innerHTML=''}

// ---------- drawing ----------
function person(x,y,s,body,head,o={}){
  X.save();X.translate(x,y);X.rotate(o.rot||0);X.scale(s,s);
  X.fillStyle=body;X.beginPath();X.ellipse(0,18,16,24,0,0,7);X.fill();
  X.fillStyle=head;X.beginPath();X.arc(0,-14,12,0,7);X.fill();
  if(o.hair){X.fillStyle=o.hair;X.beginPath();X.arc(0,-18,13,Math.PI,0);X.fill()}
  if(o.sleep){const k=performance.now()/300;X.fillStyle='#f3e6c8';X.font='bold 14px Georgia';X.fillText('z',16,-26-Math.sin(k)*3);X.fillText('Z',24,-38-Math.cos(k)*3)}
  X.restore()
}
function tent(){
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7b4a22');g.addColorStop(1,'#3a2412');X.fillStyle=g;X.fillRect(0,0,W,H);
  X.strokeStyle='rgba(0,0,0,.25)';X.lineWidth=2;for(let i=0;i<9;i++){X.beginPath();X.moveTo(W/2,0);X.lineTo(i*W/8,H*.62);X.stroke()}
  X.fillStyle='#5c3a1d';X.fillRect(0,H*.62,W,H*.38);
  X.fillStyle='rgba(255,220,140,.3)';X.beginPath();X.moveTo(W*.82,0);X.lineTo(W*.9,0);X.lineTo(W,H*.62);X.lineTo(W*.86,H*.62);X.fill();
  X.fillStyle='#8e2b20';X.fillRect(W*.1,H*.55,W*.66,H*.12);X.fillStyle='#d9c79e';X.fillRect(W*.1,H*.52,W*.66,H*.05);
  // patched, threadbare blanket: noble in name only
  X.fillStyle='#6b4a2a';X.fillRect(W*.3,H*.57,18,12);X.fillRect(W*.55,H*.6,14,10);
  for(let i=0;i<6;i++){X.fillStyle=i%2?'#c9a227':'#7a5a2a';X.save();X.translate(W*(.1+i*.15),H*(.8+(i%3)*.05));X.rotate(i%2?1.4:0);X.fillRect(-5,-12,10,16);X.restore()}
  // IOU notes pinned to tent pole
  X.fillStyle='#efe2bf';for(let i=0;i<4;i++){X.save();X.translate(W*.05+8,H*(.15+i*.09));X.rotate((i%2?.2:-.15));X.fillRect(0,0,26,18);X.restore()}
}
let shakes=0,armorIdx=0,armorOrder=[],rubs=0,lastX=null,rubDir=0;
function drawTent(){
  tent();
  const sh=mini==='wake'?Math.sin(performance.now()/40)*Math.min(shakes,6):0;
  const up=scene!=='tent'||armorIdx>0||mini==='knot'||mini==='armor';
  person(W*.43+sh,H*(up?.44:.5),1.4,up&&armorIdx>=3?'#9aa4ad':'#8a1f1f','#e2b48a',{rot:up?0:-1.5,sleep:!up&&shakes<14,hair:'#3b2412'});
  person(W*.2,H*.53,1.05,'#3f5f8f','#f0c9a0',{rot:-1.3,hair:'#c99a3a',sleep:scene==='tent'});
  person(W*.66,H*.53,1.05,'#6a3f8f','#d8a47e',{rot:-1.7,hair:'#1f140c',sleep:scene==='tent'});
  person(W*.86,H*.72,1.1,'#4a6b3a','#e9c29a',{hair:'#5a3a1a'});
  if(mini==='knot'){X.strokeStyle='#ffdf7a';X.lineWidth=3;X.beginPath();X.arc(W*.5,H*.7,30+Math.sin(performance.now()/90)*4,0,7);X.stroke();X.fillStyle='#ffdf7a';X.font='bold 15px Georgia';X.textAlign='center';X.fillText('← rub the knot →',W*.5,H*.7+52);X.textAlign='left'}
  if(mini==='armor')armorOrder.forEach((p,i)=>{if(i<armorIdx)return;X.fillStyle=i===armorIdx?'#ffdf7a':'rgba(255,223,122,.35)';X.beginPath();X.arc(p.x,p.y,22,0,7);X.fill();X.fillStyle='#2b1a0c';X.font='bold 13px Georgia';X.textAlign='center';X.fillText(p.n,p.x,p.y+5);X.textAlign='left'});
}

// ---------- STORY ----------
function start(){
  scene='tent';
  talk([
   ['','<i>Dawn. Tourney day at Amboise. The tent smells of spilled wine and worse decisions.</i>'],
   ['','<i>Your lord, Sir Bart Sheen, lies sideways across the bed, boots on and goblet in hand, between two ladies of the court, Isabeau and Margot. All three are snoring in harmony.</i>'],
   ['','<i>The blanket is patched. The tent pole is wallpapered with IOUs. Bart\'s title is very old. His money is very gone.</i>'],
   ['Squire (you)','<i>You are sixteen, calm as still water, and the joust starts at the next bell.</i>'],
   ['Squire (you)','My lord. It is morning.',[['Shake him gently',wake],['Ring the tourney bell in his ear',()=>{addXP(5);say('Bold.');wake()}]]]
  ]);
}
function wake(){mini='wake';shakes=0;meterOn(0);instr('Wake Bart','<b>Tap the picture fast</b> to shake him awake!')}
function wakeTap(){
  shakes++;meterOn(Math.min(100,shakes/14*100));
  const m=['"Five more goblets…"','"I\'m not drunk, I\'m bi-goblet."','"I am awake. I am VERY awake."','"Who lit the sun without asking me?"'];
  if(shakes%4===0)say(m[(shakes/4-1)%4]);
  if(shakes>=14){mini=null;meterOff();addXP(10);awake()}
}
function awake(){
  talk([
   ['Sir Bart Sheen','<i>bolts upright</i> WINNING! I was winning. In the dream. And in life, obviously.'],
   ['Isabeau','<i>without opening her eyes</i> He was not winning. He lost his boots at cards. Those are Margot\'s boots.'],
   ['Margot','They are my boots. He looks wonderful in them.'],
   ['Sir Bart Sheen','Ladies! My goddesses! Meet my squire. Best thing I own. Possibly the only thing I own.'],
   ['Sir Bart Sheen','People say, "Bart, you have no money." I say, "I have something better: a boy who stops me falling off things." Duh.'],
   ['Sir Bart Sheen','Best jouster in France, by the way. Ask anyone. Ask the ladies. Where ARE the ladies? Oh, there you are. Brew?'],
   ['Squire (you)','The joust is at the next bell, my lord.',[['"Your lance is ready, my lord."',()=>{addXP(5);standUp()}],['"Your cousin the Baron will be in the stands."',()=>{addXP(5);baronLine()}]]]
  ]);
}
function baronLine(){
  talk([
   ['Sir Bart Sheen','<i>His smile flickers for half a heartbeat.</i> My cousin. Rich as a cathedral. He has the gold, and I have the good looks and the tiger blood.'],
   ['Isabeau','The tiger blood is Burgundy.'],
   ['Sir Bart Sheen','Burgundy tiger blood. Rare vintage.'],
   ['Sir Bart Sheen','Mark me, boy: I am the finest lance in France. I\'d be rich as him if not for one tiny loan. Years ago. From him.'],
   ['Margot','How much was it?'],
   ['Sir Bart Sheen','<i>counts on his fingers, runs out, borrows Margot\'s</i> I\'ve paid it a hundred times. Yet somehow I still owe it. He has a little book. The book is always right.'],
   ['Isabeau','Funny, that.'],
   ['Sir Bart Sheen','<i>shrugs</i> Oh well. Debts are for sober men. Now, where are my ladies, and where is my brew?'],
   ['Margot','We are right here. And you are holding the brew.'],
   ['Sir Bart Sheen','<i>peers into goblet</i> So I am. Winning.'],
  ],standUp);
}
function standUp(){
  talk([['Sir Bart Sheen','Right! To the joust! <i>He stands up, grins and turns grey.</i>'],
        ['Sir Bart Sheen','AAGH! My leg! It\'s seizing! It\'s… galloping on its own!'],
        ['Margot','A cramp! The horse kind!'],
        ['Sir Bart Sheen','Do NOT tell Tancrède. He\'ll think I\'m competition.']],
   ()=>{mini='knot';rubs=0;lastX=null;rubDir=0;meterOn(0);instr('Work the Knot','<b>Rub left and right</b> across the glowing knot until it loosens.')});
}
function knotMove(x){
  if(lastX!==null){const d=x-lastX;const dir=Math.sign(d);if(Math.abs(d)>6&&dir!==rubDir){rubDir=dir;rubs++;meterOn(Math.min(100,rubs/16*100));if(rubs%5===0)say(['"Lower… no, MORE lower…"','"This is the most a man has touched my leg without being paid."','"Ahh. That\'s the stuff."'][(rubs/5-1)%3])}}
  lastX=x;
  if(rubs>=16){mini=null;meterOff();ach('Work the Knot',10);knotDone()}
}
function knotDone(){
  talk([['Sir Bart Sheen','Ohhh. Gone. You\'ve got healer\'s hands, my boy. Wasted on me. Gloriously wasted.'],
        ['Isabeau','The physicians call that a "horse-cramp."'],
        ['Margot','At court they\'ll call it a Bart-horse by supper.'],
        ['Squire (you)','Armour, my lord. Quickly.']],
   ()=>{mini='armor';armorIdx=0;armorOrder=[{n:'Boots',x:W*.36,y:H*.72},{n:'Greaves',x:W*.52,y:H*.62},{n:'Breast',x:W*.38,y:H*.46},{n:'Helm',x:W*.5,y:H*.3}].sort(()=>Math.random()-.5);
        instr('Armour Up','<b>Tap the straps in order</b>, starting with the bright one. Bart loosened every one of them "for comfort."')});
}
function armorTap(x,y){
  const p=armorOrder[armorIdx];if(!p)return;
  if(Math.hypot(x-p.x,y-p.y)<34){armorIdx++;say(['"Snug!"','"Too snug!"','"Can\'t feel my soul. Perfect."','"Do I look victorious?"'][armorIdx-1]);
    if(armorIdx>=4){mini=null;addXP(10);armorDone()}}
  else say('"That\'s not a strap, that\'s my goblet."');
}
function armorDone(){
  talk([['Sir Bart Sheen','Magnificent. Ladies, how do I look?'],
        ['Isabeau','Expensive.'],
        ['Margot','Borrowed.'],
        ['Sir Bart Sheen','Both! Now, squire, lead the way. And whatever happens, steer me away from the wine tent. I mean it this time. Mostly.']],
   ()=>{scene='walk';setupWalk()});
}

// ---------- SCENE: bird's-eye walk to the lists ----------
let sq,bt,target,wine,gate,slips=0,walkT=0,tugs=0;
function setupWalk(){
  fit();sq={x:W*.5,y:H*.88};bt={x:W*.5,y:H*.95};target={x:sq.x,y:sq.y};
  wine={x:W*.78,y:H*.5,r:Math.min(W,H)*.12};gate={x:W*.3,y:H*.08};slips=0;walkT=0;mini='walk';
  instr('To the Lists','<b>Hold and drag</b> to lead the way. Bart follows you, but he drifts toward the <b>wine tent</b>. Stay between him and it.');
  const sk=document.createElement('button');sk.textContent='Skip to the Lists \u25b8';sk.onclick=e=>{e.stopPropagation();if(mini==='walk'){mini=null;slips=1;arrive()}};opts.appendChild(sk);
}
function field(){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6f8f4a');g.addColorStop(1,'#4d6a32');X.fillStyle=g;X.fillRect(0,0,W,H);X.fillStyle='rgba(255,255,255,.06)';for(let i=0;i<40;i++){X.fillRect((i*97)%W,(i*53)%H,3,3)}}
function drawWalk(dt){
  field();
  X.fillStyle='#c9b27a';X.beginPath();X.moveTo(W*.45,H);X.quadraticCurveTo(W*.2,H*.5,gate.x,gate.y);X.lineTo(gate.x+40,gate.y);X.quadraticCurveTo(W*.35,H*.5,W*.6,H);X.fill();
  // lists gate
  X.fillStyle='#8a1f1f';X.fillRect(gate.x-30,gate.y-14,100,22);X.fillStyle='#e8c77a';X.font='bold 13px Georgia';X.fillText('THE LISTS',gate.x-12,gate.y+2);
  // wine tent
  X.fillStyle='#7a1f4f';X.beginPath();X.arc(wine.x,wine.y,wine.r,0,7);X.fill();X.strokeStyle='#e8c77a';X.lineWidth=3;X.stroke();
  X.fillStyle='#ffd';X.font='bold 13px Georgia';X.textAlign='center';X.fillText('WINE',wine.x,wine.y-2);X.fillText('(free)',wine.x,wine.y+14);X.textAlign='left';
  if(mini!=='walk'){return}
  walkT+=dt;
  sq.x+=(target.x-sq.x)*Math.min(1,dt*6);sq.y+=(target.y-sq.y)*Math.min(1,dt*6);
  // Bart follows squire, plus pull toward wine
  let fx=sq.x-bt.x,fy=sq.y-bt.y;const dl=Math.hypot(fx,fy);
  let sp=dl>40?70:0;let vx=dl?fx/dl*sp:0,vy=dl?fy/dl*sp:0;
  const wx=wine.x-bt.x,wy=wine.y-bt.y,wd=Math.hypot(wx,wy);
  const pull=Math.max(0,1-wd/(wine.r*3.2))*85;
  // squire standing between blocks pull
  const block=Math.hypot(sq.x-(bt.x+wx*.4),sq.y-(bt.y+wy*.4))<45;
  if(!block){vx+=wx/wd*pull;vy+=wy/wd*pull}
  bt.x+=vx*dt;bt.y+=vy*dt;
  if(pull>40&&!block&&Math.random()<dt*1.5)say(['"Just one sip. For luck."','"Is that… a sign from God? It says WINE."','"I can smell it. It smells like winning."'][Math.floor(Math.random()*3)]);
  if(wd<wine.r){slips++;say('"…Hello, old friend."  Bart has entered the wine tent.');bt.x=W*.5;bt.y=H*.95;sq.x=W*.5;sq.y=H*.88;target={x:sq.x,y:sq.y};tugs++}
  // trail
  person(bt.x,bt.y,.6,'#9aa4ad','#e2b48a',{hair:'#3b2412',rot:Math.sin(walkT*5)*.25});
  person(sq.x,sq.y,.55,'#4a6b3a','#e9c29a',{hair:'#5a3a1a'});
  if(Math.hypot(bt.x-gate.x-20,bt.y-gate.y)<45){mini=null;arrive()}
}
function arrive(){
  if(slips===0)ach('Tent? What Tent?',15);else addXP(10);
  talk([
   ['','<i>The bell rings out over Amboise. Banners snap in the wind and the crowd roars.</i>'],
   ['Sir Bart Sheen',slips?'Made it! Barely! You can\'t fault a man for visiting friends. Wine counts as a friend.':'Made it! Sober-ish! Do you know how rare that is? Write it down. Someone write it down.'],
   ['','<i>High in the stands, in a coat that cost more than Bart\'s whole life, a man in black velvet watches. He doesn\'t clap. He writes something down in a small ledger.</i>'],
   ['Sir Bart Sheen','<i>quietly, for once</i> …Don\'t look at him, my boy. Look at me. I\'m much more fun.'],
   ['Sir Bart Sheen','Lance, please. Let\'s go win something. Duh.'],
   ['','<b>End of the opening.</b> Next: the Tourney at Amboise, with lance hand-ups from the barrier.',[['▶ Try the joust prototype',()=>location.href='joust.html'],['↺ Play the opening again',()=>location.reload()]]]
  ]);
}
// ---------- input + loop ----------
function pos(e){const r=C.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
let down=false;
C.addEventListener('pointerdown',e=>{e.preventDefault();down=true;try{C.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);
  if(mini==='wake')wakeTap();else if(mini==='armor')armorTap(p.x,p.y);else if(mini==='walk')target=p;else if(mini==='knot')lastX=p.x;});
C.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);if(mini==='knot')knotMove(p.x);else if(mini==='walk')target=p});
addEventListener('pointerup',()=>{down=false;lastX=null});addEventListener('pointercancel',()=>{down=false;lastX=null});
let last=performance.now();
function loop(t){const dt=Math.max(0,Math.min(.05,(t-last)/1000));last=t;X.clearRect(0,0,W,H);if(scene==='walk')drawWalk(dt);else drawTent();requestAnimationFrame(loop)}
const CHAPTERS=[['1 · Wake Bart (start)','start'],['1 · To the Lists (walk)','walk'],['1 · Arrive at the Lists','arrive'],['2 · Joust prototype','joust'],['3 · Combat (5 fights)','combat'],['Doctor cutscene','doctor']];
const cm=document.getElementById('chapMenu');
CHAPTERS.forEach(([n,k])=>{const b=document.createElement('button');b.textContent=n;b.style.cssText='display:block;width:100%;margin:4px 0;padding:10px;font-size:15px;border-radius:6px;border:0;background:#3a2716;color:#ffe;text-align:left';b.onclick=e=>{e.stopPropagation();location.href='index.html?chapter='+k};cm.appendChild(b)});
document.getElementById('chapBtn').onclick=e=>{e.stopPropagation();cm.style.display=cm.style.display==='none'?'block':'none'};
function jump(k){
  if(k==='joust'){location.href='joust.html';return true}
  if(k==='combat'){location.href='combat.html';return true}
  if(k==='doctor'){location.href='doctor.html';return true}
  if(k==='walk'){scene='walk';setupWalk();return true}
  if(k==='arrive'){scene='walk';fit();gate={x:W*.3,y:H*.08};wine={x:W*.78,y:H*.5,r:Math.min(W,H)*.12};mini=null;slips=1;arrive();return true}
  return false}
requestAnimationFrame(loop);
const _ch=new URLSearchParams(location.search).get('chapter');
if(!(_ch&&_ch!=='start'&&jump(_ch)))openingCut(start);
</script></body></html>
