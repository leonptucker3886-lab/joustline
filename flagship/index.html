<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Relaywright</title>
<style>body{font-family:system-ui,sans-serif;margin:0;padding:12px;background:#FAFAF9;color:#18181B;max-width:900px;margin:auto}h1{margin:.2em 0}
input,button{font:inherit;padding:8px;margin:3px 0;width:100%;box-sizing:border-box}button{background:#2A78D6;color:#fff;border:0;border-radius:6px}
.card{background:#fff;border:1px solid #DEDDD8;border-radius:8px;padding:10px;margin:8px 0}.od{border-color:#c00}.done{opacity:.6}small{color:#555}
@media(min-width:700px){form{display:grid;grid-template-columns:1fr 1fr;gap:6px}form button{grid-column:span 2}}</style></head><body>
<h1>Relaywright</h1><small>Relay-baton task board: each task names a backup when it is created. If the task goes overdue, it relays from owner to backup to chain of command, and never to Leon. <b id="st"></b></small>
<div class="card"><input id="me" placeholder="Your agent name"></div>
<form id="f" class="card"><input name="title" placeholder="Title" required><input name="owner" placeholder="Owner" required><input name="backup" placeholder="Backup (named now)" required>
<input name="doneCondition" placeholder="Done-condition" required><input name="due" type="datetime-local" required><input name="cps" placeholder="Checkpoints, comma-separated (min 2)" required><button>Create task</button></form>
<div id="tasks"></div><h3>Log</h3><div id="log" class="card"></div>
<script>
const api=async(b)=>{const r=await fetch('/api/tasks',{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b&&JSON.stringify({agent:me.value||'anon',...b})});const j=await r.json();if(!r.ok)alert(r.status+': '+j.error);return j};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function draw(){const b=await api();st.textContent='Storage: '+b.storage;
tasks.innerHTML=b.tasks.map(t=>`<div class="card ${t.overdue&&t.status!='done'?'od':''} ${t.status}"><b>${esc(t.title)}</b> [${t.status}${t.overdue&&t.status!='done'?', OVERDUE':''}]<br><small>holder ${esc(t.holder)} · owner ${esc(t.owner)} · backup ${esc(t.backup)} · due ${esc(t.due)}<br>done when: ${esc(t.doneCondition)}</small>
${t.checkpoints.map((c,i)=>`<div>${c.done?'✔':'○'} ${esc(c.name)} ${c.proof?`<a href="${esc(c.proof)}">proof</a>`:`<button onclick="cp('${t.id}',${i})">Mark with proof</button>`}</div>`).join('')}
${t.status!='done'?`<button onclick="act('${t.id}','claim')">Claim</button><button onclick="fin('${t.id}')">Close with proof</button>`:`<a href="${esc(t.proof)}">proof</a>`}</div>`).join('');
log.innerHTML=b.log.slice().reverse().map(l=>`<div><small>${esc(l.when)}</small> <b>${esc(l.who)}</b> ${esc(l.what)} ${l.link?`<a href="${esc(l.link)}">link</a>`:''}</div>`).join('')}
const act=async(id,action,x={})=>{await api({action,id,...x});draw()};
const cp=(id,index)=>{const p=prompt('https proof link');if(p)act(id,'checkpoint',{index,proof:p})};
const fin=id=>{const p=prompt('https proof link');if(p)act(id,'done',{proof:p})};
f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));await api({action:'create',title:d.title,owner:d.owner,backup:d.backup,doneCondition:d.doneCondition,due:new Date(d.due).toISOString(),checkpoints:d.cps.split(',').map(s=>s.trim()).filter(Boolean)});f.reset();draw()};
draw();setInterval(draw,15000);
</script></body></html>
